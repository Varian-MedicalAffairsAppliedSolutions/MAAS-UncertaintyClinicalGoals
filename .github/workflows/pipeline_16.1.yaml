name: Build ESAPI Script - v16.1

on:
  workflow_dispatch:
    inputs:
      dateInput:
        description: 'Expiration Date'
        required: true
        default: '6/1/2025'

jobs:
  build:
    name: Build ESAPI Script - v16.1
    runs-on: windows-latest

    env:
      PROJECT_NAME: UncertaintyClinicalGoals
      PROJECT_ROOT: ${{ github.workspace }}\UncertaintyGoals
      CSPROJ_FILE_NAME: UncertaintyClinicalGoals.csproj
      BUILD_NUMBER: ${{ github.run_number }}
      NUGET_PACKAGES_DIR: ${{ github.workspace }}\packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure required tooling is available
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $msbuildCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe"
          )

          $msbuild = $msbuildCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found on windows-latest runner."
          }

          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

          Get-Command nuget | Out-Null

      - name: Get Current Date
        id: currentDate
        uses: Kaven-Universe/github-action-current-date-time@v1
        with:
          format: "MM/DD/YYYY"

      - name: Download Microsoft.NETFramework.ReferenceAssemblies for v4.6.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "${{ env.NUGET_PACKAGES_DIR }}" | Out-Null
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -OutputDirectory "${{ env.NUGET_PACKAGES_DIR }}"

      - name: Update AssemblyInfo.cs
        id: update_assembly_info
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\.github\workflows\Update-AssemblyInfo.ps1 `
            -AssemblyInfoFilePath "${{ env.PROJECT_ROOT }}\Properties\AssemblyInfo.cs" `
            -ExpirationDate "${{ github.event.inputs.dateInput }}" `
            -BuildNumber ${{ env.BUILD_NUMBER }} `
            -MajorVersion 1 `
            -MinorVersion 0 `
            -PatchVersion 0

      - name: Install project NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          nuget install .\UncertaintyGoals\packages.config -OutputDirectory .\UncertaintyGoals\packages

      - name: Download ESAPI package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          nuget install ESAPI -Version 16.1.0 -OutputDirectory "${{ env.NUGET_PACKAGES_DIR }}"

      - name: Restore NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          nuget restore .\UncertaintyGoals\UncertaintyClinicalGoals.csproj -PackagesDirectory "${{ env.NUGET_PACKAGES_DIR }}"

      - name: Update hint paths in the csproj file
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\.github\workflows\Update-EsapiHintPaths.ps1 `
            -CsprojFilePath "${{ github.workspace }}\UncertaintyGoals" `
            -CsprojFileName "${{ env.CSPROJ_FILE_NAME }}" `
            -PackagesPath "${{ env.NUGET_PACKAGES_DIR }}"

      - name: Build Solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "${env:MSBUILD_PATH}" `
            .\UncertaintyGoals\UncertaintyClinicalGoals.csproj `
            /nologo /nr:false /p:DeleteExistingFiles=True /p:platform="x64" /p:configuration="Release"

      - name: Zip output
        id: zip_release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = "${{ github.workspace }}\V16.1-${{ steps.update_assembly_info.outputs.RELEASE_FILE_NAME }}.zip"
          $releaseDir = "${{ github.workspace }}\UncertaintyGoals\bin\x64\Release"

          Get-ChildItem -Path $releaseDir -Recurse | Compress-Archive -DestinationPath $zipPath
          "NORMALIZED_FILE_PATH=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          name: ${{ env.PROJECT_NAME }}${{ steps.update_assembly_info.outputs.RELEASE_NAME }}-EclipseV16.1
          tag_name: ${{ env.PROJECT_NAME }}${{ steps.update_assembly_info.outputs.RELEASE_NAME }}-EclipseV16.1
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          body: |
            This is an official release of the **`${{ env.PROJECT_NAME }}`** project.
            Supported Eclipse version: `v16.1`.
            The generated dll is valid until `${{ github.event.inputs.dateInput }}`, and generated on `${{ steps.currentDate.outputs.time }}`.
          files: ${{ steps.zip_release.outputs.NORMALIZED_FILE_PATH }}
