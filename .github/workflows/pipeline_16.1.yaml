name: Build ESAPI Script - v16.1

on:
  workflow_dispatch:
    inputs:
      dateInput:
        description: 'Expiration Date'
        required: true
        default: '12/31/2027'

permissions:
  contents: write

jobs:
  build:
    name: Build ESAPI Script - v16.1
    runs-on: windows-latest

    env:
      PROJECT_NAME: UncertaintyClinicalGoals
      PROJECT_ROOT: ${{ github.workspace }}\UncertaintyGoals
      CSPROJ_FILE_NAME: UncertaintyClinicalGoals.csproj
      BUILD_NUMBER: ${{ github.run_number }}
      NUGET_PACKAGES_DIR: ${{ github.workspace }}\packages

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate MSBuild without setup-msbuild action
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found. Visual Studio is not installed on the runner."
          }

          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw "Could not detect a Visual Studio installation with MSBuild."
          }

          $msbuild = Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) {
            throw "MSBuild.exe was not found under $installPath"
          }

          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV
          Write-Host "Using MSBuild at: $msbuild"

      - name: Get Current Date
        id: currentDate
        uses: Kaven-Universe/github-action-current-date-time@v1
        with:
          format: "MM/DD/YYYY"

      - name: Install .NET Framework 4.6.1 reference assemblies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "${{ env.NUGET_PACKAGES_DIR }}" | Out-Null
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -OutputDirectory "${{ env.NUGET_PACKAGES_DIR }}"

          $refDir = Get-ChildItem "${{ env.NUGET_PACKAGES_DIR }}\Microsoft.NETFramework.ReferenceAssemblies.net461*" -Directory |
            Select-Object -First 1

          if (-not $refDir) {
            throw "Could not locate Microsoft.NETFramework.ReferenceAssemblies.net461 package."
          }

          $target = Join-Path $refDir.FullName "build\.NETFramework\v4.6.1"
          if (-not (Test-Path $target)) {
            throw "Reference assemblies were not found under: $target"
          }

          "REFERENCE_ASSEMBLIES_PATH=$target" >> $env:GITHUB_ENV
          Write-Host "Using reference assemblies at: $target"

      - name: Update AssemblyInfo.cs
        id: update_assembly_info
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          .\.github\workflows\Update-AssemblyInfo.ps1 `
            -AssemblyInfoFilePath "${{ env.PROJECT_ROOT }}\Properties\AssemblyInfo.cs" `
            -ExpirationDate "${{ github.event.inputs.dateInput }}" `
            -BuildNumber ${{ env.BUILD_NUMBER }} `
            -MajorVersion 1 `
            -MinorVersion 0 `
            -PatchVersion 0

      - name: Install project NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          nuget install .\UncertaintyGoals\packages.config -OutputDirectory .\UncertaintyGoals\packages

      - name: Add GitHub NuGet repository using PAT
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sourceName = "github"
          $sourceUrl = "https://nuget.pkg.github.com/Varian-MedicalAffairsAppliedSolutions/index.json"
          $token = "${{ secrets.NUGET_GITHUB_TOKEN }}"

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "Missing secret: NUGET_GITHUB_TOKEN. Create a PAT with read:packages access to the Varian package source."
          }

          $existing = nuget sources list | Select-String -Pattern $sourceName
          if (-not $existing) {
            nuget source add `
              -Name $sourceName `
              -Source $sourceUrl `
              -UserName "github-actions" `
              -Password $token `
              -StorePasswordInClearText
          } else {
            nuget source update `
              -Name $sourceName `
              -Source $sourceUrl `
              -UserName "github-actions" `
              -Password $token `
              -StorePasswordInClearText
          }

      - name: Download ESAPI package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          nuget install ESAPI -Version 16.1.0 -OutputDirectory "${{ env.NUGET_PACKAGES_DIR }}"

      - name: Restore NuGet packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          nuget restore .\UncertaintyGoals\UncertaintyClinicalGoals.csproj -PackagesDirectory "${{ env.NUGET_PACKAGES_DIR }}"

      - name: Update hint paths in the csproj file
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          .\.github\workflows\Update-EsapiHintPaths.ps1 `
            -CsprojFilePath "${{ github.workspace }}\UncertaintyGoals" `
            -CsprojFileName "${{ env.CSPROJ_FILE_NAME }}" `
            -PackagesPath "${{ env.NUGET_PACKAGES_DIR }}"

      - name: Build Solution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:MSBUILD_PATH" `
            .\UncertaintyGoals\UncertaintyClinicalGoals.csproj `
            /nologo /nr:false `
            /p:DeleteExistingFiles=True `
            /p:platform="x64" `
            /p:configuration="Release" `
            /p:FrameworkPathOverride="$env:REFERENCE_ASSEMBLIES_PATH" `
            /p:TargetFrameworkRootPath="$env:REFERENCE_ASSEMBLIES_PATH" `
            /p:TargetFrameworkFallbackSearchPaths="$env:REFERENCE_ASSEMBLIES_PATH"

      - name: Zip output
        id: zip_release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zipPath = "${{ github.workspace }}\V16.1-${{ steps.update_assembly_info.outputs.RELEASE_FILE_NAME }}.zip"
          $releaseDir = "${{ github.workspace }}\UncertaintyGoals\bin\x64\Release"

          Get-ChildItem -Path $releaseDir -Recurse | Compress-Archive -DestinationPath $zipPath
          "NORMALIZED_FILE_PATH=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          name: ${{ env.PROJECT_NAME }}${{ steps.update_assembly_info.outputs.RELEASE_NAME }}-EclipseV16.1
          tag_name: ${{ env.PROJECT_NAME }}${{ steps.update_assembly_info.outputs.RELEASE_NAME }}-EclipseV16.1
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          body: |
            This is an official release of the **`${{ env.PROJECT_NAME }}`** project.
            Supported Eclipse version: `v16.1`.
            The generated dll is valid until `${{ github.event.inputs.dateInput }}`, and generated on `${{ steps.currentDate.outputs.time }}`.
          files: ${{ steps.zip_release.outputs.NORMALIZED_FILE_PATH }}
